services:
  # SurrealDB 2.x — reachable at ws://localhost:8008/rpc
  surrealdb-v2:
    image: surrealdb/surrealdb:v2
    command: start --user root --pass root memory
    ports:
      - "8008:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SurrealDB 3.x — reachable at ws://localhost:8009/rpc
  surrealdb-v3:
    image: surrealdb/surrealdb:v3
    command: start --user root --pass root memory
    ports:
      - "8009:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
